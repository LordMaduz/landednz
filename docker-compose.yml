services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Dev-only credentials - use secure values in production
      POSTGRES_DB: landednz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landednz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: