[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run prisma:generate --workspace=@landednz/api && npx tsc"

[deploy]
startCommand = "node dist/apps/api/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "landednz-api"

[variables]
NODE_ENV = "production"