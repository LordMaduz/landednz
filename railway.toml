[build]
builder = "NIXPACKS"
buildCommand = "npm install && cd apps/api && echo '=== Checking TypeScript ===' && npx tsc --version && echo '=== Running Prisma Generate ===' && npm run prisma:generate && echo '=== Running TypeScript Build ===' && npm run build && echo '=== Checking Directory Structure ===' && pwd && ls -la && echo '=== Checking Dist Directory ===' && ls -la dist/ && echo '=== Checking Dist/Src Directory ===' && ls -la dist/src/ && echo '=== Build Complete ==='"

[deploy]
startCommand = "cd apps/api && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "landednz-api"

[variables]
NODE_ENV = "production"