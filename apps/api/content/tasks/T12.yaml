id: T12
name: "Enrol with a GP"
phase: 3
priority: 85
boosts:
  - when:
      family:
        - COUPLE_CONSTRAINED
    by: 10
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 20
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 8
  - when:
      family:
        - SOLO
    by: 5
urgency: []
duration: 30–60 minutes (registration process; ongoing relationship)
appliesTo: all
dependsOn:
  - task: T22
    type: soft
retired: false
why:
  - id: T12.why.enrol
    text: "Health New Zealand says everyone should enrol with a general practice to get help with all their health needs."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.why.fees
    text: "Health New Zealand says enrolled patients pay a reduced, subsidised consultation fee, while patients who aren't enrolled usually pay a higher casual rate."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
steps:
  - id: T12.steps.find
    text: "Search Healthpoint, which Govt.nz links from its Find a doctor page. Select 'Enrolling new patients' to see only practices that are accepting new patients."
    source: govt-nz-find-a-doctor
    checked: 2026-10-27
    verified: true
  - id: T12.steps.choose
    text: "Health New Zealand says you can choose the doctor or general practice you visit. It lists fees, distance, opening hours, after-hours services and wait times among the things to consider."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.steps.eligibility
    text: "Check your eligibility before you enrol. Govt.nz says practices can only enrol people who are eligible for publicly funded health services."
    source: govt-nz-find-a-doctor
    checked: 2026-10-27
    verified: true
  - id: T12.steps.work-visa
    text: "If you're on a work visa: Health New Zealand's guide lists work visas that let you stay {{health.work-visa-length}} or more among those that meet its criteria, and says time you have already been here legally counts towards that. Read the guide for your own situation."
    when:
      visa: [AEWV, PARTNER_WORK, POST_STUDY_WORK, SPECIFIC_PURPOSE_WORK, WORKING_HOLIDAY, OTHER]
    source: healthnz-eligibility-guide
    checked: 2026-10-27
    verified: true
  - id: T12.steps.enrol
    text: "Contact the practice you've chosen. Health New Zealand says enrolling is free, and you take proof of eligibility, such as a passport, and sign an enrolment form."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.steps.full
    text: "If a practice isn't taking new patients: Health New Zealand says it should refer you to its primary health organisation (PHO), which may put you on a waiting list and arrange care in the meantime."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.steps.after-hours
    text: "Ask your practice what to do when it is closed. Health New Zealand says you may need an after-hours accident and medical clinic or another practice, and Healthline (0800 611 116) gives free health advice from registered nurses at any time."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.steps.pregnant
    text: "If you're pregnant: Govt.nz says that as soon as your pregnancy is confirmed you need to choose a lead maternity carer (LMC), most of whom are registered midwives. The same page links to Health New Zealand's pregnancy services eligibility."
    source: govt-nz-while-pregnant
    checked: 2026-10-27
    verified: true
documents:
  - id: T12.documents.proof
    text: "Proof of eligibility, such as your passport (Health New Zealand's general practices page)"
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.documents.work-visa
    text: "If you're on a work visa: Health New Zealand says to show your valid passport endorsed with a current work visa that lets you stay the required length of time"
    when:
      visa: [AEWV, PARTNER_WORK, POST_STUDY_WORK, SPECIFIC_PURPOSE_WORK, WORKING_HOLIDAY, OTHER]
    source: healthnz-eligibility-guide
    checked: 2026-10-27
    verified: true
mistakes:
  - id: T12.mistakes.wait
    text: "Waiting until you are ill to enrol. Health New Zealand says patients who aren't enrolled usually pay the higher casual rate."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T12.watchOuts.fees
    text: "Health New Zealand says general practices are private businesses and set their own fees, so ask each practice what it charges. It also says practices may charge separately for things like repeat prescriptions and referral letters."
    source: healthnz-general-practices
    checked: 2026-10-27
    verified: true
  - id: T12.watchOuts.acc
    text: "ACC: Health New Zealand's eligibility guide says ACC can cover treatment for accidents and personal injuries regardless of residential status."
    source: healthnz-eligibility-guide
    checked: 2026-10-27
    verified: true
  - id: T12.watchOuts.dates
    text: "Health New Zealand's guide says changes to who can get publicly funded health services take effect from {{health.eligibility-regs-start}}. Check the guide again on the date you enrol."
    source: healthnz-eligibility-guide
    checked: 2026-10-27
    verified: true
  - id: T12.watchOuts.pregnancy-eligibility
    text: "If you're pregnant: Govt.nz says people who aren't NZ citizens or permanent residents may still be able to get free or subsidised pregnancy care, and points to Health New Zealand's pregnancy services eligibility to find out."
    source: govt-nz-while-pregnant
    checked: 2026-10-27
    verified: true
