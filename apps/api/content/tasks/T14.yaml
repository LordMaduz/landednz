id: T14
name: Tenancy Rights and Dispute Resolution
phase: 3
priority: 72
boosts: []
urgency: []
duration: 30 minutes (reading and awareness)
processingTime: 4 weeks
appliesTo:
  family:
    - SOLO
    - COUPLE_DUAL_WORK
    - COUPLE_CONSTRAINED
    - FAMILY_WITH_CHILDREN
dependsOn: []
retired: false
why:
  - id: T14.why.1
    text: As a sole tenant, asserting your rights may feel more daunting without a partner to share the process.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
steps:
  - id: T14.steps.1
    text: "**This is primarily an awareness task. Actions are triggered only if issues arise.** **Ongoing best practice:**"
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.2
    text: Always communicate with your landlord or property manager in writing (email or messaging app with read receipts). Verbal agreements are hard to enforce.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.3
    text: "Keep all tenancy documents: signed agreement, condition report, payment receipts, maintenance requests, and responses."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.4
    text: Report maintenance issues in writing as soon as they arise — do not wait. A written record establishes when the landlord was notified. **If you receive an unlawful demand:** - Landlord requests bond above 4 weeks rent → politely decline in writing, cite RTA Section 18. - Landlord charges a letting fee → do not pay; letting fees are illegal under RTA Section 13B. - Landlord attempts to enter without notice → advise in writing that 24/48 hours notice is required under RTA Section 48. - Landlord attempts a rent increase within 12 months or without 60 days notice → decline in writing, cite RTA Section 24. **If a dispute arises:**
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.5
    text: Document everything — dates, communications, photos if relevant.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.6
    text: "Contact Tenancy Services mediation: tenancy.govt.nz or 0800 836 262."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.7
    text: A mediator will contact both parties and attempt to resolve the dispute. Mediation is free and confidential.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.8
    text: "If mediation fails, apply to the Tenancy Tribunal online at tenancy.govt.nz/disputes/apply-to-tribunal. Hearing fee: $28 [Type B]."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.9
    text: Tribunal hearings are held in person (or by AVL). Both parties present their case. Decisions are legally binding. **At end of tenancy:**
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.10
    text: Give correct written notice (28 days for periodic tenancy).
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.11
    text: Clean property thoroughly and repair any damage caused by you (not fair wear and tear).
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.12
    text: Attend a checkout inspection with the property manager.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.steps.13
    text: If bond deductions are disputed, do not agree to deductions you consider unfair — apply to Tenancy Services for bond adjudication instead.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
documents: []
mistakes:
  - id: T14.mistakes.1
    text: Do not accept verbal assurances from landlords or property managers — everything must be in writing for Tenancy Tribunal purposes.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.mistakes.2
    text: Some Auckland property managers are large agencies with dedicated legal teams. Do not be intimidated — the Tenancy Tribunal process is designed to be accessible to tenants without legal representation.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.mistakes.3
    text: "Failing to understand: If you receive a 63-day notice to vacate without explanation, this is lawful (periodic tenancy) — but if it follows you asserting a right (e.g. requesting repairs), it may constitute retaliatory notice, which is unlawful under RTA Section 54A. Document the timeline carefully."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.mistakes.4
    text: "Failing to understand: Subletting (renting your place to others) requires written landlord consent unless your tenancy agreement explicitly permits it. Unauthorised subletting is a breach of tenancy and grounds for termination."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T14.mistakes.5
    text: "Failing to understand: Moving out without giving proper written notice forfeits your right to the bond refund for the notice period and may result in a Tribunal order for additional rent."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
