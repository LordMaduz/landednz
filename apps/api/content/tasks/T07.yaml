id: T07
name: Open an NZ bank account
phase: 2
priority: 95
boosts: []
urgency:
  - fromDay: 1
    toDay: 3
    by: 30
duration: 45–90 minutes
appliesTo: all
dependsOn:
  - task: T06
    type: soft
retired: false
why:
  - id: T07.why.inz-bank
    text: "Immigration New Zealand says you will need a New Zealand bank account and IRD number to pay tax."
    source: www-immigration-govt-nz-live-setting-up-your-life-in-new-zealand-when-you-arrive-in-new-zealand
    checked: 2026-10-27
    verified: true
  - id: T07.why.deposit-cover
    text: "The Deposit Takers Act 2023 sets compensation for a depositor's protected deposits at up to {{dta.compensation-limit}}, or a higher temporary limit if one applies."
    source: deposit-takers-act-2023
    checked: 2026-10-27
    verified: true
  - id: T07.why.disputes
    text: "The Financial Markets Authority says every business that offers financial services to retail customers must belong to an independent dispute resolution scheme, which can give a free, independent view on a complaint."
    source: fma-disputes
    checked: 2026-10-27
    verified: true
steps:
  - id: T07.steps.identity
    text: "Have your ID ready. The AML/CFT Act says a bank must collect your full name, date of birth and address, and verify your identity, normally before it takes you on as a customer."
    source: aml-cft-act-2009
    checked: 2026-10-27
    verified: true
  - id: T07.steps.ird-number
    text: "Once you have your IRD number, give it to your bank. Inland Revenue says interest is taxed at {{ird.rwt-no-number-rate}} if your bank doesn't have it."
    source: ird-rwt-rate
    checked: 2026-10-27
    verified: true
  - id: T07.steps.rwt-rate
    text: "Choose a resident withholding tax (RWT) rate for your interest. Inland Revenue says that if you don't choose one, tax is deducted at {{ird.rwt-default-rate}}."
    source: ird-rwt-rate
    checked: 2026-10-27
    verified: true
  - id: T07.steps.joint
    text: "If you're moving as a couple and open a joint account: Inland Revenue says you can only use one RWT rate for it."
    source: ird-rwt-rate
    checked: 2026-10-27
    verified: true
documents:
  - id: T07.documents.identity
    text: "ID the bank can use to verify your full name and date of birth"
    source: aml-cft-act-2009
    checked: 2026-10-27
    verified: true
  - id: T07.documents.address
    text: "Your address, which the AML/CFT Act says the bank must collect"
    source: aml-cft-act-2009
    checked: 2026-10-27
    verified: true
  - id: T07.documents.ird-number
    text: "Your IRD number, once you have it"
    source: ird-rwt
    checked: 2026-10-27
    verified: true
mistakes:
  - id: T07.mistakes.wrong-rwt
    text: "Choosing an RWT rate that doesn't match your income tax rate. Inland Revenue says you may get an end-of-year tax bill."
    source: ird-rwt-rate
    checked: 2026-10-27
    verified: true
  - id: T07.mistakes.overseas-transfer
    text: "Sending money overseas before you've checked who you're paying. Consumer Protection says it's very difficult to get money back once it has been sent overseas."
    source: consumer-protection-scamwatch
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T07.watchOuts.bank-impersonation
    text: "Consumer Protection says scammers may pretend to be from a reputable company, a bank or a government agency."
    source: consumer-protection-scamwatch
    checked: 2026-10-27
    verified: true
  - id: T07.watchOuts.credit-report
    text: "Sorted says three agencies hold credit data in New Zealand, you can get a free copy of your credit report from each, and checking your own report doesn't affect your score."
    source: sorted-credit-reports
    checked: 2026-10-27
    verified: true
