id: T07
name: Open an NZ bank account
phase: 2
priority: 95
boosts: []
urgency:
  - fromDay: 1
    toDay: 3
    by: 30
duration: 45–90 minutes in branch. Debit card arrives 3–5 business days later.
appliesTo: all
dependsOn:
  - task: T06
    type: soft
retired: false
why:
  - id: T07.why.1
    text: Visit an ANZ or BNZ branch on Day 1 or Day 2.
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
steps:
  - id: T07.steps.1
    text: "Key differences for new migrants: | Bank | Monthly fee | Debit card | Migrant notes | |------|-------------|-----------|---------------| | ANZ | $0 | Free | Largest branch network. Pre-arrival application available. Most flexible on address proof. | | ASB | $0 (paperless) | $5/6 months | Good migrant banking. Does NOT accept hostel/temporary addresses. Requires more permanent address. | | BNZ | $0 | Free | No appointment needed for identity verification. Online application then branch visit. | | Westpac | $0 | Free (first year) | Good migrant banking. Pre-arrival application available up to 180 days before. | | Kiwibank | $0 | $10 one-off | NZ-owned. Requires work visa of more than 1 year — AEWV qualifies. | **Recommendation for Day 1–3:** ANZ or BNZ. Most flexible on temporary accommodation addresses. Largest branch networks."
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.steps.2
    text: "Bring: - Passport (original — not a copy) - Visa documentation (eVisa letter printed, or passport showing visa stamp) - Proof of NZ address (hotel/serviced apartment booking confirmation — accepted by ANZ, BNZ, Westpac but NOT ASB) - IRD number if already received (not mandatory but speeds the process) - NZ mobile number (from T06)"
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.steps.3
    text: "Walk in — no appointment needed at most ANZ and BNZ branches for individual account opening. Tell the teller you are a new migrant opening a first account. The process typically takes 45–90 minutes. You will: - Complete an application form (in branch or on a tablet) - Have your identity and visa verified - Provide your NZ address - Choose account type (everyday transaction account — standard for new migrants) - Leave with your account number and BSB (bank branch) number"
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.steps.4
    text: "Format: XX-XXXX-XXXXXXX-XX (bank code — branch — account — suffix) You will need this for: - IRD application (T08) - KiwiSaver election (T10) - Employer payroll setup - Wise/Remitly account setup (T15)"
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.steps.5
    text: "Before leaving the branch or same day: register for online banking using your NZ mobile number and email. Download the bank's app. Enable notifications for transactions."
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.steps.6
    text: Your debit card is mailed to your NZ address. You can use your account number for bank transfers immediately. For card payments, use Apple Pay or Google Pay linked to your new account — available as soon as you set up online banking, before the physical card arrives.
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
documents:
  - id: T07.documents.1
    text: passport
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.documents.2
    text: visa
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.documents.3
