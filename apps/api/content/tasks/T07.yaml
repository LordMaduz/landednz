mistakes:
  - id: T07.mistakes.1
    text: Do not apply for a credit card at account opening. NZ banks require 3–6 months of NZ credit history and income verification for credit card approval. Applying too early results in a hard credit enquiry and likely rejection — both of which can slightly harm your emerging NZ credit file (Task T18).
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.mistakes.2
    text: "Failing to understand: ASB's address restriction catches many migrants off guard. If you are in an Airbnb or hostel, go to ANZ or BNZ first."
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.mistakes.3
    text: Your NZ bank account number format (XX-XXXX-XXXXXXX-XX) is different from Indian or Singaporean account formats. When providing to your employer, give the full number in the NZ format — do not abbreviate.
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.mistakes.4
    text: "Failing to understand: Internet banking typically requires SMS verification when setting up from a new device. This is why having your NZ SIM active before going to the bank (T06 before T07) matters — the bank will SMS your NZ number during setup."
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T07.mistakes.5
    text: "Failing to understand: Opening bank accounts at multiple banks simultaneously is unnecessary and creates administrative complexity. Open one account, use it for 3–6 months, then add accounts if needed."
    source: www-anz-co-nz-personal-bank-accounts-new-to-new-zealand
    checked: 2026-03-03
    verified: false
    numberType: C
