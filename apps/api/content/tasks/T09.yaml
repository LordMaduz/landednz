why:
  - id: T09.why.1
    text: Complete T08 (IRD number) first — you cannot fill in the IR330 without it.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
steps:
  - id: T09.steps.1
    text: You cannot complete the IR330 without your IRD number. Complete T08 first and wait for your IRD number to be issued (typically 1–2 business days).
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.steps.2
    text: "URL: https://www.ird.govt.nz/forms-guides/number/forms-300-399/ir330-tax-code-declaration Download the PDF. The form is one page."
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.steps.3
    text: 'For most skilled migrants in their first NZ job, the answer is straightforward: - **"M"** — Your main (or only) income source. Use this if this is your only job in New Zealand. - **"M SL"** — Use this only if you have a New Zealand student loan (most new migrants do not). - **"SB", "S", "SH", "ST"** — Secondary income codes. Use only if you have a second job or additional income source in NZ. - **"SB SL", "S SL" etc** — Secondary income with student loan. Not applicable to most new migrants. - **"WT"** — Schedular payments (contract/freelance). Not applicable to AEWV salaried employees. **Most AEWV skilled migrants select "M". If in doubt, use "M".**'
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.steps.4
    text: 'Fill in: - Your full legal name (as per passport) - Your IRD number (8 or 9 digits) - Your date of birth - Your tax code selection (circle or tick "M" for main income) - Sign and date'
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.steps.5
    text: Hand the completed IR330 to your employer's HR or payroll team. Do this before your first pay day. Most NZ employers have a standard onboarding packet that includes the IR330 — if your employer provides one, complete that copy rather than downloading your own (same form, same result).
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.steps.6
    text: On your first payslip, verify that the tax code shown matches "M" and that deductions look reasonable relative to your salary and the NZ tax brackets. If anything looks wrong, contact HR and IRD promptly.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
documents:
  - id: T09.documents.1
    text: passport
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.documents.2
    text: ird number
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.documents.3
