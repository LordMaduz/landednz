mistakes:
  - id: T09.mistakes.1
    text: "Failing to understand: The most common mistake is simply not submitting the IR330 before the first pay day. Add it to your Day 1 employer checklist alongside your employment agreement, bank account details, and emergency contacts."
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.mistakes.2
    text: 'Failing to understand: Tax code "M" is not a flat 10.5% rate — it triggers the full progressive marginal rate schedule. Your effective tax rate will be higher than 10.5% if your income exceeds $14,000 per year (which it will for most skilled migrants).'
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.mistakes.3
    text: "Failing to understand: New Zealand has no tax-free threshold in the way some countries do — tax applies from dollar one of income."
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.mistakes.4
    text: Do not use a secondary tax code (SB, S, SH, ST) for your main job. Secondary codes apply only to secondary income sources. Using SB on your main income means 10.5% flat rate — which will result in a tax bill at year end.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.mistakes.5
    text: 'Failing to understand: If your visa allows work but you are technically self-employed or contracting, the relevant code is "WT" (schedular payments) — not "M." Confirm with your employer whether you are an employee or contractor before selecting a code.'
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
watchOuts:
  - id: T09.watchOuts.1
    text: The most common mistake is simply not submitting the IR330 before the first pay day. Add it to your Day 1 employer checklist alongside your employment agreement, bank account details, and emergency contacts.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.watchOuts.2
    text: Tax code "M" is not a flat 10.5% rate — it triggers the full progressive marginal rate schedule. Your effective tax rate will be higher than 10.5% if your income exceeds $14,000 per year (which it will for most skilled migrants).
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.watchOuts.3
    text: New Zealand has no tax-free threshold in the way some countries do — tax applies from dollar one of income.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.watchOuts.4
    text: Do not use a secondary tax code (SB, S, SH, ST) for your main job. Secondary codes apply only to secondary income sources. Using SB on your main income means 10.5% flat rate — which will result in a tax bill at year end.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.watchOuts.5
    text: If your visa allows work but you are technically self-employed or contracting, the relevant code is "WT" (schedular payments) — not "M." Confirm with your employer whether you are an employee or contractor before selecting a code.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
  - id: T09.watchOuts.6
    text: The NZ tax year ends 31 March. If you arrive mid-year, you will file a partial-year return for your first NZ tax year. IRD handles this automatically for PAYE employees — no manual calculation needed.
    source: www-ird-govt-nz-forms-guides-number-forms-300-399-ir330-tax-code-declaration
    checked: 2026-03-03
    verified: false
