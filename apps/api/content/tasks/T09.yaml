id: T09
name: Give your employer a tax code (IR330)
phase: 3
priority: 97
boosts:
  - when:
      family:
        - COUPLE_CONSTRAINED
    by: 20
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 15
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 18
  - when:
      family:
        - SOLO
    by: 10
urgency:
  - months:
      - 2
      - 3
    afterFirstYear: true
    by: 25
duration: 15–20 minutes
appliesTo: all
dependsOn:
  - task: T08
    type: hard
retired: false
why:
  - id: T09.why.deduction
    text: "Inland Revenue says your tax code tells your employer how much tax to deduct from your pay, and that choosing the right one helps you avoid a tax bill at the end of the tax year."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.why.non-declaration
    text: "If you don't give your employer an IR330, Inland Revenue says they deduct tax at the non-declaration rate of {{ird.non-declaration-rate}}."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
steps:
  - id: T09.steps.open-ir330
    text: "Open Inland Revenue's tax code declaration (IR330). Its flowcharts help you work out which code to use. You'll need your IRD number from the previous task."
    source: ird-ir330
    checked: 2026-10-27
    verified: true
  - id: T09.steps.main-code
    text: "Choose one tax code for your main or highest source of income. Inland Revenue says the code depends on the type and amount of that income."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.steps.sections
    text: "Complete your details (including your IRD number), your tax code and the declaration. The IR330 says that if you leave out any of these, your employer must deduct tax at the non-notified rate of {{ird.non-declaration-rate}} plus earners' levy."
    source: ird-ir330
    checked: 2026-10-27
    verified: true
  - id: T09.steps.give-employer
    text: "Give the completed IR330 to your employer. Inland Revenue says that once they have it they can deduct the right amount of tax."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.steps.second-job
    text: "If you're getting income from more than one source at the same time: Inland Revenue says you may need a secondary tax code for the extra income, because it can push you into a higher tax bracket."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.steps.seeking-work
    text: "If you're still looking for work: do this when your job starts. Inland Revenue says you complete the IR330 and give it to your employer or payer."
    when:
      occupation: [SEEKING_WORK]
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.steps.changes
    text: "If your tax code changes later, Inland Revenue says you need to give your employer or payer a new IR330."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
documents:
  - id: T09.documents.ird-number
    text: "Your IRD number, which the IR330 asks for in section 1"
    source: ird-ir330
    checked: 2026-10-27
    verified: true
mistakes:
  - id: T09.mistakes.m-twice
    text: "Using the M tax code on two sources of income at the same time. Inland Revenue says it will ask your employer or payer to change the code and will notify you."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T09.watchOuts.acc-levy
    text: "Inland Revenue says all employees pay an ACC earners' levy, deducted along with the tax in your PAYE. The current rate is {{ird.earners-levy-rate}} of income, on income up to {{ird.earners-levy-max}}, so expect a levy line on your payslip."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.watchOuts.wrong-code
    text: "Inland Revenue says that if it sees you using an unsuitable tax code, it may suggest you change it or apply for a tailored tax code."
    source: ird-tax-codes
    checked: 2026-10-27
    verified: true
  - id: T09.watchOuts.contractor
    text: "If you're a contractor using the WT tax code, the IR330 says to use the IR330C form instead."
    source: ird-ir330
    checked: 2026-10-27
    verified: true
