advice:
  id: T05.advice.1
  text: '"Indian departure year tax filing, NRI status determination, and FEMA compliance are complex and fact-specific. LandedNZ provides general orientation only. Users should consult a CA (Chartered Accountant) in India before departure for their specific situation — particularly if they have property income, investments, or significant assets in India. Sri Lankan users should similarly consult a local tax advisor regarding departure year filing obligations."'
  source: www-ird-govt-nz-roles-nz-tax-residents-exemption
  checked: 2026-03-03
  verified: false
  required: true
