id: T11
name: Sign a rental and protect your bond
phase: 3
priority: 88
boosts:
  - when:
      family:
        - COUPLE_CONSTRAINED
    by: 10
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 15
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 8
  - when:
      family:
        - SOLO
    by: 5
urgency: []
duration: 2–4 hours (viewings + agreement review + bond lodgement)
processingTime: 4 weeks
appliesTo: all
dependsOn:
  - task: T07
    type: hard
  - task: T01
    type: soft
retired: false
why:
  - id: T11.why.1
    text: As a solo migrant, consider a 1BR apartment or a room in a flatshare for the first 3–6 months — lower upfront cost and more flexibility while establishing NZ credit history and understanding suburbs.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
steps:
  - id: T11.steps.1
    text: Use trademe.co.nz/property (primary NZ rental listing site) and realestate.co.nz. Filter by suburb, bedroom count, and budget. Set up email alerts for new listings. Auckland rental market moves quickly — respond to listings within hours and schedule viewings immediately.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.2
    text: "Never sign a rental agreement for a property you have not personally inspected. Common Auckland rental issues: dampness/mould (especially in older villas), single-glazed windows (cold in winter), poor insulation, street parking only. Check heating (heat pump is preferred), water pressure, and mobile signal inside the property."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.3
    text: "Applications typically require: photo ID (passport), proof of income (employment offer letter or payslips), NZ bank account details, previous landlord references (overseas references acceptable for new migrants), and personal references. Some property managers use tenancy application platforms (Tapi, Palace, Renti)."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.4
    text: "Check: rent amount, bond amount (must not exceed 4 weeks rent), tenancy type (fixed or periodic), start date, names of all tenants, no letting fee charged, break clause terms (for fixed-term). Do not sign under time pressure — you are entitled to read the full agreement."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.5
    text: Photograph every room at the start of tenancy. Note every mark, stain, scratch, and defect on the condition report. Email your completed condition report to the property manager with photos attached. Keep all copies.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.6
    text: "Bond: maximum 4 weeks rent. Rent in advance: maximum 2 weeks. Pay by bank transfer (never cash without receipt). Keep payment confirmation records."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.7
    text: "Within 23 working days of paying your bond, your landlord or property manager must lodge it with Tenancy Services. You will receive a bond lodgement receipt from Tenancy Services. If you do not receive this within 4 weeks, contact Tenancy Services: 0800 836 262. Check bond status at: https://www.tenancy.govt.nz/bonds/check-bond-status"
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.steps.8
    text: "At move-in, arrange: - Electricity: Contact provider (Genesis, Contact, Mercury, Flick, or similar) to transfer account to your name. Compare at powerswitch.org.nz. - Internet: Spark, One NZ, 2degrees, Voyager — compare plans at broadbandcompare.co.nz. - Contents insurance: Arranged before or on move-in day (see T04). Landlord's insurance does NOT cover your belongings."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
