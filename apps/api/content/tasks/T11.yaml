mistakes:
  - id: T11.mistakes.1
    text: "Failing to understand: Never pay a bond in cash without an immediate written receipt. Always pay by bank transfer to a documented account."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.mistakes.2
    text: "Failing to understand: If your landlord does not lodge the bond within 4 weeks, follow up in writing and contact Tenancy Services. Unlodged bonds are a red flag."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.mistakes.3
    text: Do not sign a rental agreement with a letting fee included — this is illegal under the RTA and you should refuse or report to Tenancy Services.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.mistakes.4
    text: "Failing to understand: The property condition report is your primary bond protection document. A vague or incomplete report at move-in is used by landlords to claim damage at move-out. Document everything with photos before moving any furniture in."
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.mistakes.5
    text: Auckland rental scams exist — especially on Facebook Marketplace. Legitimate landlords do not ask for bond before a signed agreement, do not communicate only by WhatsApp, and do not claim to be overseas. Use trademe.co.nz and licensed property managers where possible.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
watchOuts:
  - id: T11.watchOuts.1
    text: Never pay a bond in cash without an immediate written receipt. Always pay by bank transfer to a documented account.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.watchOuts.2
    text: If your landlord does not lodge the bond within 4 weeks, follow up in writing and contact Tenancy Services. Unlodged bonds are a red flag.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.watchOuts.3
    text: Do not sign a rental agreement with a letting fee included — this is illegal under the RTA and you should refuse or report to Tenancy Services.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.watchOuts.4
    text: The property condition report is your primary bond protection document. A vague or incomplete report at move-in is used by landlords to claim damage at move-out. Document everything with photos before moving any furniture in.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.watchOuts.5
    text: Auckland rental scams exist — especially on Facebook Marketplace. Legitimate landlords do not ask for bond before a signed agreement, do not communicate only by WhatsApp, and do not claim to be overseas. Use trademe.co.nz and licensed property managers where possible.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
  - id: T11.watchOuts.6
    text: As a new migrant, you may feel pressure to accept poor-condition properties because of lack of NZ rental history. You have full rights under the RTA from day one of your tenancy — visa status does not affect tenancy rights.
    source: www-legislation-govt-nz-act-public-1986-0120-latest-dlm94278-html
    checked: 2026-03-03
    verified: false
