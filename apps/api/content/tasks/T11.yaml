id: T11
name: Sign a rental and protect your bond
phase: 3
priority: 88
boosts:
  - when:
      family:
        - COUPLE_CONSTRAINED
    by: 10
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 15
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 8
  - when:
      family:
        - SOLO
    by: 5
urgency: []
duration: 2–4 hours (viewings + agreement review + bond lodgement)
appliesTo: all
dependsOn:
  - task: T07
    type: hard
  - task: T01
    type: soft
retired: false
why:
  - id: T11.why.written
    text: "Tenancy Services says tenancy agreements must be in writing, and the landlord must give you a copy of the signed agreement before the tenancy starts. It says the Residential Tenancies Act 1986 still applies even if there is no written agreement."
    source: tenancy-agreements
    checked: 2026-10-27
    verified: true
  - id: T11.why.tenant-or-flatmate
    text: "Tenancy Services says that if you sign a tenancy agreement with a landlord you are a tenant and covered by the Residential Tenancies Act 1986. It says flatmates, who live under someone else's tenancy agreement or rent a room in the owner's own home, are not covered by the Act."
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
steps:
  - id: T11.steps.read-agreement
    text: "Read the whole tenancy agreement, including its terms and conditions, before you sign. Tenancy Services says to sign only when you are sure you want the property, and to keep a signed copy and any receipts somewhere safe."
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
  - id: T11.steps.statements
    text: "Check that the agreement comes with the landlord's signed healthy homes standards compliance statement. Tenancy Services says all new or renewed agreements must include one, and landlords must also include insurance and insulation statements."
    source: tenancy-required-statements
    checked: 2026-10-27
    verified: true
  - id: T11.steps.inspection
    text: "Inspect the property with your landlord and record its condition on the property inspection report. Tenancy Services suggests taking photos, and says you and the landlord should both sign, date and keep a copy of the report."
    source: tenancy-initial-inspection
    checked: 2026-10-27
    verified: true
  - id: T11.steps.no-fees
    text: "Do not pay a letting fee. Tenancy Services says landlords and their agents cannot charge tenants letting fees, and that landlords cannot charge key money, except an option fee of up to {{housing.option-fee-max}} to hold the property."
    source: tenancy-letting-fees
    checked: 2026-10-27
    verified: true
  - id: T11.steps.bond-lodged
    text: "Tenancy Services says that if you pay the bond to the landlord, they must lodge it with Tenancy Services within {{housing.bond-lodge-days}} of receiving it. You and the landlord then get confirmation with the bond number."
    source: tenancy-lodging-bond
    checked: 2026-10-27
    verified: true
  - id: T11.steps.bond-check
    text: "If you have not been told your bond is lodged, contact your landlord. Tenancy Services says to do this if you have no notification within {{housing.bond-check-weeks}}."
    source: tenancy-bond-problems
    checked: 2026-10-27
    verified: true
  - id: T11.steps.utilities
    text: "Arrange your own services. Tenancy Services says you will need to get services such as electricity, gas, internet and phone connected."
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
  - id: T11.steps.if-wrong
    text: "If something goes wrong and you cannot sort it out by talking to your landlord, Tenancy Services lists the next options: FastTrack Resolution, mediation, or an application to the Tenancy Tribunal."
    source: tenancy-disputes
    checked: 2026-10-27
    verified: true
  - id: T11.steps.contact
    text: "For questions about bonds or any other tenancy matter, Tenancy Services runs a Tenancy Information line on 0800 836 262, free if you're in New Zealand."
    source: tenancy-contact-us
    checked: 2026-10-27
    verified: true
documents:
  - id: T11.documents.signed-agreement
    text: "Your signed tenancy agreement, which Tenancy Services says the landlord must give you a copy of before the tenancy starts"
    source: tenancy-agreements
    checked: 2026-10-27
    verified: true
  - id: T11.documents.compliance-statement
    text: "The landlord's signed healthy homes standards compliance statement"
    source: tenancy-agreements
    checked: 2026-10-27
    verified: true
  - id: T11.documents.inspection-report
    text: "The property inspection report, signed and dated by you and the landlord"
    source: tenancy-initial-inspection
    checked: 2026-10-27
    verified: true
  - id: T11.documents.bond-receipt
    text: "The receipt for your bond, which Tenancy Services says the landlord must provide"
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
mistakes:
  - id: T11.mistakes.skip-inspection
    text: "Skipping the inspection report or not keeping a signed copy. Tenancy Services says the report can be evidence in a dispute, and a tenant cannot be blamed for damage recorded when the tenancy started."
    source: tenancy-initial-inspection
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T11.watchOuts.tenant-number
    text: "Tenancy Services says to keep your Tenant Number safe and not share it with anyone, not even your landlord."
    source: tenancy-lodging-bond
    checked: 2026-10-27
    verified: true
  - id: T11.watchOuts.discrimination
    text: "Tenancy Services says landlords cannot refuse to rent to you or end your tenancy for reasons that breach the Human Rights Act."
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
  - id: T11.watchOuts.services-cut
    text: "Tenancy Services says a landlord cannot cause, or directly turn off, the power or water supply unless it is necessary to avoid danger to a person or to allow repairs."
    source: tenancy-utilities
    checked: 2026-10-27
    verified: true
advice:
  id: T11.advice.before-signing
  text: "Tenancy Services says that if there is anything in the tenancy agreement you do not understand, you should seek advice before you sign."
  required: false
  source: tenancy-agreements
  checked: 2026-10-27
  verified: true
cost:
  id: T11.cost.bond
  text: "Tenancy Services says the bond can be up to {{housing.bond-max-tenancy}}, and that you should work out your total move-in cost before renting."
  source: tenancy-new-tenants
  checked: 2026-10-27
  verified: true
