id: T02
name: "Book temporary accommodation"
phase: 1
priority: 88
boosts: []
urgency: []
duration: 1–2 hours (research and booking)
appliesTo: all
dependsOn: []
retired: false
why:
  - id: T02.why.first-weeks
    text: "Immigration New Zealand says that unless you're staying with family or have accommodation through your employer or education provider, you'll need somewhere to stay for the first few weeks while you look for something permanent."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
steps:
  - id: T02.steps.open-inz
    text: "Open Immigration New Zealand's page on hotels, motels and other places to live temporarily."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
  - id: T02.steps.compare
    text: "Compare the options it describes, such as a hotel or motel, a holiday rental, a cabin at a holiday park or camping ground, or a boarding house."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
  - id: T02.steps.quote
    text: "Use a booking website to find a place, and for a hotel or motel, ask for a quote for a longer stay."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
  - id: T02.steps.facilities
    text: "Check the facilities at holiday parks. Immigration New Zealand says some have a shared kitchen, bathroom and laundry."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
  - id: T02.steps.visit
    text: "If you're renting a home, visit it before you commit."
    source: inz-renting
    checked: 2026-10-27
    verified: true
  - id: T02.steps.agreement
    text: "Sign a tenancy agreement only when you're sure you want the property."
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
documents:
  - id: T02.documents.bond-receipt
    text: "If you pay a bond for a tenancy: the bond receipt, which the landlord must give you"
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
mistakes:
  - id: T02.mistakes.no-quote
    text: "Booking a hotel or motel for a long stay without asking for a quote."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
  - id: T02.mistakes.unseen
    text: "Committing to a rental before you've visited it."
    source: inz-renting
    checked: 2026-10-27
    verified: true
  - id: T02.mistakes.unchecked-payment
    text: "Making a payment before you've checked the request is genuine. Consumer Protection says to stop and think first."
    source: consumer-protection-scams
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T02.watchOuts.not-covered
    text: "Tenancy Services says the Residential Tenancies Act doesn't cover hotels and motels, or holiday homes rented for a holiday."
    source: tenancy-not-protected
    checked: 2026-10-27
    verified: true
  - id: T02.watchOuts.short-fixed-term
    text: "Tenancy Services says a short fixed-term tenancy lasts {{housing.short-fixed-term-max}} or less."
    source: tenancy-short-fixed-term
    checked: 2026-10-27
    verified: true
  - id: T02.watchOuts.seasons
    text: "Immigration New Zealand says the price and availability of short-term places change through the year, with tourist numbers, university start dates and school holidays."
    source: inz-temporary-places
    checked: 2026-10-27
    verified: true
  - id: T02.watchOuts.bond-not-covered
    text: "Tenancy Services says a bond shouldn't be lodged for an arrangement the Residential Tenancies Act doesn't cover."
    source: tenancy-bond-problems
    checked: 2026-10-27
    verified: true
  - id: T02.watchOuts.letting-fees
    text: "If it's a tenancy: landlords and their agents can't charge letting fees or key money. Tenancy Services says the only exception to the key money ban is an option fee of at most {{housing.option-fee-max}}."
    source: tenancy-letting-fees
    checked: 2026-10-27
    verified: true
cost:
  id: T02.cost.holiday-parks
  text: "Immigration New Zealand says holiday parks and camping grounds can be a cheaper option for short stays."
  source: inz-temporary-places
  checked: 2026-10-27
  verified: true
