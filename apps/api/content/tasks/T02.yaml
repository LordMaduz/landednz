id: T02
name: Book temporary accommodation
phase: 1
priority: 88
boosts: []
urgency: []
duration: 1–2 hours (research and booking)
processingTime: 2–4 weeks
appliesTo: all
dependsOn: []
retired: false
why:
  - id: T02.why.1
    text: Book a studio or 1-bedroom serviced apartment in the CBD for 2–3 weeks.
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
steps:
  - id: T02.steps.1
    text: Temporary accommodation should be in or near your shortlisted permanent rental zone. Staying in the CBD for temporary accommodation is practical even if your long-term plan is a suburban rental — CBD gives easy access to bank branches, IRD, and the main business district for your first week of admin tasks.
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.steps.2
    text: 'Options in order of suitability for a 2–4 week stay: - **Serviced apartments (best):** Kitchen, laundry, weekly rates. Quest Serviced Apartments, Adina Apartment Hotels, and Barclay Suites in Auckland CBD are established options. Weekly rates approximately $700–$1,200/week for a 1-bedroom. Book direct for best rates. - **Airbnb weekly rentals:** Good value for 2+ weeks. Filter for "entire place" with kitchen. Set weekly view for pricing. CBD, Newmarket, Parnell, and Mt Eden have good supply. - **University of Auckland transitional accommodation:** UoA offers short-term accommodation for new students in some periods. Contact UoA Accommodation Office (accom@auckland.ac.nz) before departure — options not always publicly advertised. - **Community homestay:** Indian and Sri Lankan community networks (Facebook groups: "Indians in Auckland NZ", "Sri Lankans in New Zealand") sometimes offer homestay accommodation. Cheaper and culturally familiar. Less reliable to book in advance.'
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.steps.3
    text: "Before confirming any booking, verify: - Full kitchen access (not just microwave) — important for South Asian cooking - Laundry access (in-unit or in-building) - Address clearly documented on booking confirmation — this is your official NZ address for Day 1 admin - Walking distance to or easy PT to CBD (for bank branch access in first week) - Flexible check-out or extension option in case rental search takes longer than expected"
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.steps.4
    text: "Save your booking confirmation as a PDF. This document is your proof of NZ address for: - Bank account opening (T07) — ANZ, BNZ, Westpac accept hotel/serviced apartment bookings. ASB does not accept temporary/hostel addresses. - IRD number application (T08) - SIM card (T06 — no address required but useful to have)"
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.steps.5
    text: "Confirm: airport transfer options, check-in time (especially for late evening flights), key collection process. Auckland Airport (AKL) is in Mangere, South Auckland — approximately 25–35 minutes from CBD by car off-peak, longer in traffic. AirportLink bus and Super Shuttle are standard airport transfer options."
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
documents:
  - id: T02.documents.1
    text: visa
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.documents.2
    text: ird number
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
mistakes:
  - id: T02.mistakes.1
    text: Do not book non-refundable temporary accommodation before confirming your flight dates are fixed — NZ visa processing timelines can shift.
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.mistakes.2
    text: 'Failing to understand: Airbnb "entire place" is significantly better than a shared house for a couple arriving in a new country. The privacy and kitchen access are worth the small premium for a 2–4 week stay.'
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.mistakes.3
    text: "Failing to understand: ASB Bank will reject a hostel or Airbnb address for bank account opening. If you plan to open with ASB, book a named serviced apartment hotel (Quest, Adina) that clearly appears as a business address on the booking confirmation."
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.mistakes.4
    text: "Failing to understand: Auckland rental applications typically require a NZ bank account reference. Opening your bank account early in week 1 enables you to include it in rental applications by week 2."
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T02.mistakes.5
    text: Do not extend temporary accommodation indefinitely — this is expensive. Set yourself a 4-week maximum deadline to secure a permanent rental, even if it means taking a good-enough option rather than a perfect one.
    source: www-auckland-ac-nz-en-on-campus-accommodation-html
    checked: 2026-03-03
    verified: false
    numberType: C
