id: T20
name: KiwiSaver Confirmation and Fund Review
phase: 3
priority: 50
boosts: []
urgency: []
duration: 1–2 hours
appliesTo:
  family:
    - SOLO
    - COUPLE_DUAL_WORK
    - COUPLE_CONSTRAINED
    - FAMILY_WITH_CHILDREN
dependsOn:
  - task: T08
    type: hard
  - task: T10
    type: hard
retired: false
why:
  - id: T20.why.1
    text: At 3 months, take 60 minutes to review your KiwiSaver setup.
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
steps:
  - id: T20.steps.1
    text: "URL: https://myir.ird.govt.nz Navigate to KiwiSaver → your account summary. Confirm: current provider, fund type, contribution rate, current balance, and year-to-date contributions."
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.steps.2
    text: "If you are under 50 and have a 15+ year investment horizon: - Conservative/defensive fund → switch to growth or aggressive - Balanced fund → consider switching to growth if comfortable with volatility - Growth or aggressive fund → no change needed Use the sorted.org.nz fund finder to compare your current fund's fees and historical performance against alternatives."
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.steps.3
    text: "Calculate: (months employed in NZ ÷ 12) × $1,042.86 = contributions target for the year. Example: 3 months employed → $260.72 should have been contributed so far. If your contributions are below target, consider a one-off voluntary top-up via myIR or directly through your provider."
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.steps.4
    text: Switching is free and takes approximately 5–10 business days. Go to your chosen new provider's website → select "switch from existing provider." The new provider manages the transfer. Your balance moves automatically — you do not need to contact your old provider.
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.steps.5
    text: "To change contribution rate: log in to myIR → KiwiSaver → change contribution rate. Takes effect from your next pay period. Notify your employer's payroll team if they require separate notification (most handle it automatically through the myIR system)."
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
documents: []
mistakes:
  - id: T20.mistakes.1
    text: Do not switch providers without comparing fees and fund performance first. Some providers with strong brand recognition charge high fees that erode returns. Use sorted.org.nz for neutral comparison.
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.mistakes.2
    text: "Failing to understand: The government member tax credit is calculated on contributions from 1 July to 30 June each year — if you arrive mid-year, your first credit will be pro-rated. This is normal."
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.mistakes.3
    text: "Failing to understand: Increasing your contribution rate reduces your take-home pay. Model the impact before changing: at 6% vs 3% on a $100,000 salary, the difference is $3,000 per year in take-home pay, partially offset by employer matching which stays at 3% regardless."
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
  - id: T20.mistakes.4
    text: Do not make a KiwiSaver withdrawal for first home purchase until you have confirmed NZ residency plans — the first home withdrawal rules require you to have been contributing for at least 3 years and the property must be your first NZ home.
    source: www-ird-govt-nz-kiwisaver-kiwisaver-individuals-making-changes-to-my-kiwisaver-changing-to-another-provider
    checked: 2026-03-03
    verified: false
