id: T01
name: Choose where to live
phase: 1
priority: 90
boosts:
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 20
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 5
urgency: []
duration: 2–3 hours (comparing areas)
appliesTo: all
dependsOn: []
retired: false
why:
  - id: T01.why.job
    text: "Immigration New Zealand says where you live might depend on your job or where you want to study, and other things can affect the decision too."
    source: inz-choosing-where-to-live
    checked: 2026-10-27
    verified: true
  - id: T01.why.cost
    text: "Immigration New Zealand says housing costs vary by region, and houses in larger cities like Auckland and Wellington are much more expensive than in smaller places."
    source: inz-cost-of-living
    checked: 2026-10-27
    verified: true
steps:
  - id: T01.steps.open-inz
    text: "Open Immigration New Zealand's page on choosing where to live and note what matters for your household."
    source: inz-choosing-where-to-live
    checked: 2026-10-27
    verified: true
  - id: T01.steps.market-rent
    text: "Look up the weekly rent for the areas and types of home you're considering in Tenancy Services' market rent tool."
    source: tenancy-market-rent
    checked: 2026-10-27
    verified: true
  - id: T01.steps.home-check
    text: "When you look at homes, check how each one is insulated and heated, and how much sun it gets."
    source: inz-choosing-where-to-live
    checked: 2026-10-27
    verified: true
  - id: T01.steps.auckland
    text: "If you're looking at Auckland: Auckland Transport is responsible for its buses, trains and ferries."
    when:
      city: [AUCKLAND]
    source: at-transport-reform
    checked: 2026-10-27
    verified: true
  - id: T01.steps.wellington
    text: "If you're looking at the Wellington region: plan journeys on buses, trains and ferries with Metlink."
    when:
      city: [WELLINGTON]
    source: gw-metlink
    checked: 2026-10-27
    verified: true
  - id: T01.steps.school-zone
    text: "If you want your child at a particular school, check whether it has an enrolment zone. The Ministry of Education points to Education Counts to find schools near you."
    when:
      family: [FAMILY_WITH_CHILDREN, SOLE_PARENT]
    source: moe-school-zones
    checked: 2026-10-27
    verified: true
  - id: T01.steps.scheme
    text: "For a school with a zone, you can see a copy of its enrolment scheme at the school."
    when:
      family: [FAMILY_WITH_CHILDREN, SOLE_PARENT]
    source: moe-enrolment-scheme-faqs
    checked: 2026-10-27
    verified: true
documents:
  - id: T01.documents.proof-of-address
    text: "Proof of where you live, such as a tenancy agreement or a utility bill with your address, which a school with a zone may ask for"
    when:
      family: [FAMILY_WITH_CHILDREN, SOLE_PARENT]
    source: moe-enrolment-scheme-faqs
    checked: 2026-10-27
    verified: true
  - id: T01.documents.child-visa
    text: "Evidence of your child's visa status, which a school may ask for"
    when:
      family: [FAMILY_WITH_CHILDREN, SOLE_PARENT]
    source: inz-childcare-schools
    checked: 2026-10-27
    verified: true
mistakes:
  - id: T01.mistakes.market-rent-alone
    text: "Relying on the market rent figure alone. Tenancy Services says it's based on bonds from the previous {{housing.market-rent-window}} and shouldn't be used alone to work out the rent for any property."
    source: tenancy-market-rent
    checked: 2026-10-27
    verified: true
  - id: T01.mistakes.temporary-move
    text: "Moving into a school zone only for a while to get a place. The Ministry of Education says you can't do this."
    when:
      family: [FAMILY_WITH_CHILDREN, SOLE_PARENT]
    source: moe-school-zones
    checked: 2026-10-27
    verified: true
  - id: T01.mistakes.move-in-cost
    text: "Not working out the total move-in cost, including bond and any rent in advance, before you rent."
    source: tenancy-new-tenants
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T01.watchOuts.heating
    text: "Immigration New Zealand says houses don't normally have central heating."
    source: inz-choosing-where-to-live
    checked: 2026-10-27
    verified: true
  - id: T01.watchOuts.transport
    text: "Public transport can be limited in smaller centres, and in rural areas you may have to rely on a car."
    source: inz-choosing-where-to-live
    checked: 2026-10-27
    verified: true
  - id: T01.watchOuts.flatting
    text: "Immigration New Zealand says that when you first arrive you may share a house or flat, which matters if you're bringing a partner or family."
    source: inz-cost-of-living
    checked: 2026-10-27
    verified: true
  - id: T01.watchOuts.rent-in-advance
    text: "Tenancy Services says it's unlawful for a landlord to ask for more than {{housing.rent-in-advance-max}} rent in advance."
    source: tenancy-charging-rent
    checked: 2026-10-27
    verified: true
  - id: T01.watchOuts.no-guarantee
    text: "Not all schools have zones. If you live outside a school's zone, you may still be able to apply, but your child isn't guaranteed a place."
    when:
      family: [FAMILY_WITH_CHILDREN, SOLE_PARENT]
    source: moe-school-zones
    checked: 2026-10-27
    verified: true
cost:
  id: T01.cost.bond
  text: "Immigration New Zealand says rent is typically charged each week, and you may be charged up to {{housing.bond-max}} of rent as bond."
  source: inz-cost-of-living
  checked: 2026-10-27
  verified: true
