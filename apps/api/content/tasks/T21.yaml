id: T21
name: Joint Bank Account
phase: 3
priority: 45
boosts: []
urgency: []
duration: 45–60 minutes (in-branch visit)
appliesTo:
  family:
    - COUPLE_DUAL_WORK
    - COUPLE_CONSTRAINED
    - FAMILY_WITH_CHILDREN
dependsOn:
  - task: T07
    type: hard
  - task: T11
    type: soft
retired: true
why:
  - id: T21.why.1
    text: Not applicable as a primary task.
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
steps:
  - id: T21.steps.1
    text: Joint account opening requires both account holders to be present in branch. Both must have existing NZ bank accounts or the bank must be willing to open individual and joint accounts simultaneously.
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.steps.2
    text: "Simplest approach: open the joint account at the same bank as your primary individual accounts (likely ANZ if you followed T07 recommendations). This allows easy internal transfers between individual and joint accounts with no delay."
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.steps.3
    text: Both account holders must attend in person. Book online or call your branch. Visit the same ANZ or BNZ branch where individual accounts were opened.
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.steps.4
    text: "Both need to bring: - Passport - Visa evidence (eVisa letter) - NZ address proof (rental agreement) - NZ mobile number - Individual account numbers (if opening at an existing bank)"
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.steps.5
    text: "Select account type: standard everyday transaction account (no monthly fee [Type C — confirm current fee]). Confirm both account holders have equal access and withdrawal rights (standard)."
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.steps.6
    text: Once the joint account is open, set up a regular automatic transfer from each individual account to the joint account on pay day. Agree a monthly household budget amount to transfer from each partner.
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.steps.7
    text: Move rent, utilities, internet, and grocery automatic payments to the joint account. This centralises household spending and simplifies budgeting.
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
documents:
  - id: T21.documents.1
    text: passport
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.documents.2
    text: visa
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.documents.3
    text: rental agreement
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
mistakes:
  - id: T21.mistakes.1
    text: "Failing to understand: Joint account liability is joint and several — if one account holder goes into overdraft or accrues fees, both are liable. Manage the account actively and avoid overdraft."
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.mistakes.2
    text: "Failing to understand: Closing a joint account requires agreement from both account holders in most NZ bank terms — or can be forced by one party in some circumstances. Understand the terms before opening."
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.mistakes.3
    text: "Failing to understand: NZ relationship property law (Property (Relationships) Act 1976) applies to de facto couples who have lived together for 3+ years. Joint account balances, jointly purchased assets, and contributions to shared expenses can all become relationship property. This is worth understanding early — it is not alarming, but awareness prevents surprises."
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T21.mistakes.4
    text: Do not use the joint account as the sole account for salary deposits — individual accounts for salary deposits keep payroll and tax records cleaner.
    source: www-anz-co-nz-personal-bank-accounts-everyday-banking-everyday-account
    checked: 2026-03-03
    verified: false
    numberType: C
