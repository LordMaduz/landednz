id: T08
name: Get your IRD number
phase: 2
priority: 98
boosts:
  - when:
      family:
        - COUPLE_CONSTRAINED
    by: 20
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 15
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 18
  - when:
      family:
        - SOLO
    by: 10
urgency:
  - fromDay: 4
    toDay: 14
    by: 25
  - months:
      - 2
      - 3
    afterFirstYear: true
    by: 25
duration: 20–30 minutes (online application)
appliesTo: all
dependsOn: []
retired: false
why:
  - id: T08.why.tax-rate
    text: "Without your IRD number and a tax code declaration, your employer deducts tax at {{ird.non-declaration-rate}} plus the earners' levy."
    source: ird-ir330
    checked: 2026-10-25
    verified: true
steps:
  - id: T08.steps.register-myir
    text: "Register for myIR, Inland Revenue's online service. You don't need an IRD number to register."
    source: ird-myir-register
    checked: 2026-10-25
    verified: true
  - id: T08.steps.apply-new-arrival
    text: "In myIR, apply as a new arrival. Inland Revenue checks your identity with Immigration New Zealand."
    source: ird-new-arrival
    checked: 2026-10-25
    verified: true
  - id: T08.steps.final-arrival-date
    text: "Apply by your visa's final arrival date, the date you must arrive in New Zealand by. After that date you apply as living in New Zealand instead."
    source: ird-new-arrival
    checked: 2026-10-25
    verified: true
  - id: T08.steps.bank-or-ir997
    text: "If you hold a work or student visa: Inland Revenue's work and study page says new arrivals on these visas also need a New Zealand bank account or a customer due diligence form (IR997). Have one of them ready."
    when:
      not:
        visa: [STRAIGHT_TO_RESIDENCE, SKILLED_MIGRANT_RESIDENT]
    source: ird-work-or-study
    checked: 2026-10-25
    verified: true
  - id: T08.steps.delivery
    text: "If your application is approved, your IRD number comes by text or email in {{ird.new-arrival-delivery}}."
    source: ird-new-arrival
    checked: 2026-10-25
    verified: true
  - id: T08.steps.employer
    text: "Give your employer your IRD number with a completed tax code declaration (IR330)."
    source: ird-ir330
    checked: 2026-10-25
    verified: true
  - id: T08.steps.bank-interest
    text: "Give your bank your IRD number too. Without it, tax on interest is deducted at {{ird.rwt-no-number-rate}}."
    source: ird-rwt-rate
    checked: 2026-10-25
    verified: true
documents:
  - id: T08.documents.passport
    text: "Your passport details"
    source: ird-new-arrival
    checked: 2026-10-25
    verified: true
  - id: T08.documents.inz-number
    text: "Your Immigration New Zealand application number (not needed if you have an Australian passport)"
    source: ird-new-arrival
    checked: 2026-10-25
    verified: true
  - id: T08.documents.overseas-tax-number
    text: "If you hold a work or student visa: your most recent overseas tax number, if you have one"
    when:
      not:
        visa: [STRAIGHT_TO_RESIDENCE, SKILLED_MIGRANT_RESIDENT]
    source: ird-new-arrival
    checked: 2026-10-25
    verified: true
mistakes:
  - id: T08.mistakes.reapply
    text: "Applying again when you've had an IRD number before. You keep the same number for life, so find your old one instead."
    source: ird-find-number
    checked: 2026-10-25
    verified: true
watchOuts:
  - id: T08.watchOuts.free
    text: "Applying is free. Inland Revenue doesn't charge for an IRD number."
    source: ird-when-you-need-one
    checked: 2026-10-25
    verified: true
  - id: T08.watchOuts.did-not-work
    text: "If the new-arrival application doesn't work, Inland Revenue explains the other ways to apply."
    source: ird-cannot-apply-online
    checked: 2026-10-25
    verified: true
  - id: T08.watchOuts.phone
    text: "Inland Revenue's phone number for personal customers is 0800 227 774, or +64 4 832 5223 from overseas."
    source: ird-phone-numbers
    checked: 2026-10-25
    verified: true
  - id: T08.watchOuts.living-in-nz-id-check
    text: "If you apply as living in New Zealand instead, you take your identity documents to an AA Driver Licensing Agent within {{ird.living-in-nz-id-window}} of applying online."
    source: ird-living-in-nz
    checked: 2026-10-25
    verified: true
