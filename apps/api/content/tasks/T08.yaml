mistakes:
  - id: T08.mistakes.1
    text: Do not wait until your first pay day to apply — by then it is too late to avoid the 45% no-declaration rate on that pay. Apply on Day 1.
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.mistakes.2
    text: "Failing to understand: Your overseas tax number (PAN card, TIN, NRIC) is NOT valid in New Zealand. You need a New Zealand IRD number."
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.mistakes.3
    text: "Failing to understand: The IRD number is different from your visa number, passport number, and NHI health number — these are all separate identifiers."
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.mistakes.4
    text: If you previously lived in New Zealand, you may already have an IRD number. Do not apply for a new one — contact IRD to retrieve your existing number. Applying twice can create complications.
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.mistakes.5
    text: "Failing to understand: The 45% no-declaration rate is not a penalty — it is a withholding mechanism. Excess tax is credited and refunded at year-end assessment, but it harms your cash flow. Avoid by applying early."
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
