id: T08
name: Apply for your IRD number
phase: 2
priority: 98
boosts:
  - when:
      family:
        - COUPLE_CONSTRAINED
    by: 20
  - when:
      family:
        - FAMILY_WITH_CHILDREN
    by: 15
  - when:
      family:
        - COUPLE_DUAL_WORK
    by: 18
  - when:
      family:
        - SOLO
    by: 10
urgency:
  - fromDay: 4
    toDay: 14
    by: 25
  - months:
      - 2
      - 3
    afterFirstYear: true
    by: 25
duration: 20–30 minutes (online application)
appliesTo: all
dependsOn: []
retired: false
why:
  - id: T08.why.1
    text: Apply on Day 1 or Day 2 of arrival — this is the single most time-sensitive administrative task for any new worker.
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
steps:
  - id: T08.steps.1
    text: "You will need: - Your passport (the one with your New Zealand visa) - Your New Zealand visa details (visa type, expiry date — visible in your passport or on your eVisa letter) - A New Zealand address (your temporary accommodation address is acceptable — hotel, Airbnb, or serviced apartment booking confirmation) - Your New Zealand bank account number if already opened (recommended — see T07 — but not mandatory) - An email address you check regularly (IRD correspondence will be sent here)"
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.steps.2
    text: 'URL: https://www.ird.govt.nz/managing-my-tax/ird-numbers/ird-numbers-for-individuals Select "Apply for an IRD number" → "New to New Zealand."'
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.steps.3
    text: "The form asks for: - Personal details (name, date of birth, country of birth, nationality) - Contact details (NZ address, email, phone) - Visa information (visa type, expiry date) - Tax residency details (country of tax residency — most new arrivals: India, Sri Lanka, or Singapore) - Bank account number if available"
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.steps.4
    text: After submission, IRD processes the application. For applicants with a valid NZ work visa and complete information, processing typically takes 1–2 business days. IRD will email your IRD number to the address provided.
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.steps.5
    text: Store it in your phone notes (password-protected), a secure document folder, and share with partner if applicable. You will use this number repeatedly — for your employer, KiwiSaver, bank, and any future IRD correspondence.
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
  - id: T08.steps.6
    text: "As soon as you receive your IRD number, provide it to your employer's HR or payroll team along with your completed IR330 tax code declaration form (T09). Do this before your first pay day to avoid the 45% no-declaration tax rate. **If your application is delayed beyond 5 business days:** Contact IRD: Phone 0800 227 774 (individuals line, Mon–Fri 8am–8pm, Sat 9am–1pm). Note your application reference number from the confirmation email."
    source: www-ird-govt-nz-managing-my-tax-ird-numbers-ird-numbers-for-individuals
    checked: 2026-03-03
    verified: false
