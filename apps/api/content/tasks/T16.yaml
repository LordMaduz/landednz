dependsOn: []
retired: false
why:
  - id: T16.why.1
    text: Convert within 3 months — book the AA appointment, spend 2–3 hours on practice tests beforehand, and complete the conversion in a single visit.
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
steps:
  - id: T16.steps.1
    text: Ensure your Indian, Sri Lankan, or Singapore licence is not expired. If it expires within 6 months, renew it before conversion if possible — a valid overseas licence is required at the conversion appointment.
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.steps.2
    text: "The knowledge test covers NZ road rules, signs, and give-way rules. Study guide available free at nzta.govt.nz: https://www.nzta.govt.nz/driver-licences/getting-a-licence/new-to-new-zealand/overseas-licence-holders Key NZ-specific rules: give-way rules at intersections (recently updated), open road speed 100 km/h, urban speed 50 km/h (or lower where signed), cell phone prohibition while driving, seatbelt requirements for all passengers. Practice tests available at: https://www.aa.co.nz/vehicles/driving/learner-driver/practice-theory-tests"
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.steps.3
    text: "Options: AA (Automobile Association), VTNZ, Licence Direct. Check availability at: https://www.nzta.govt.nz/driver-licences/testing-and-licensing-agents Bring: current overseas licence (original), passport, proof of NZ address (rental agreement, bank statement), IRD number, payment."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.steps.4
    text: "A basic vision test is conducted at the licensing agent. Standard vision requirements: 6/12 corrected or uncorrected, adequate field of vision. Wear glasses or contact lenses if you use them for driving."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.steps.5
    text: Multiple-choice test on a computer terminal. 35 questions — must pass with 32/35 correct (32 correct or more). Test takes approximately 30 minutes. If you fail, you can resit after a waiting period.
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.steps.6
    text: "Current conversion fee: approximately $52.10 [Type B — NZTA fee schedule, subject to revision]. Your NZ licence is mailed to your registered address within 5–10 working days [Type B — NZTA processing time]."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
