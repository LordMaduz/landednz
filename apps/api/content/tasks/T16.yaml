        - SOLO
    by: 5
urgency:
  - fromDay: 275
    toDay: 336
    by: 30
duration: 1–2 hours (NZTA office visit)
processingTime: 5–10 working days
appliesTo:
  family:
    - SOLO
    - COUPLE_DUAL_WORK
    - COUPLE_CONSTRAINED
