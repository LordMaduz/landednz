mistakes:
  - id: T16.mistakes.1
    text: "Failing to understand: The 12-month clock starts from your date of entry into NZ — not from when you start driving. If you arrived in June 2026, your overseas licence expires for driving purposes in June 2027."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.mistakes.2
    text: Driving on an expired overseas licence (after 12 months) is an infringement offence. Do not let the deadline pass.
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.mistakes.3
    text: "Failing to understand: NZ road give-way rules were updated in 2012 and differ from older NZ driving knowledge — if you learned NZ rules from pre-2012 materials, review the current give-way rules carefully."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.mistakes.4
    text: "Failing to understand: If your overseas licence is in a language other than English, you may need a certified translation or IDP. Indian and Sri Lankan licences are issued in English — no translation required. Confirm at nzta.govt.nz if uncertain."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
  - id: T16.mistakes.5
    text: "Failing to understand: Car rental companies may have their own age and licence requirements beyond NZTA minimums — check with the rental company before booking."
    source: www-nzta-govt-nz-driver-licences-getting-a-licence-new-to-new-zealand-overseas-licence-holders
    checked: 2026-03-03
    verified: false
