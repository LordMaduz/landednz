id: T06
name: Get an NZ SIM card
phase: 2
priority: 98
boosts: []
urgency:
  - fromDay: 1
    toDay: 3
    by: 30
duration: 15–30 minutes
appliesTo: all
dependsOn: []
retired: false
why:
  - id: T06.why.inz-sim
    text: "Immigration New Zealand says you will need to get a New Zealand SIM card for your mobile phone."
    source: www-immigration-govt-nz-live-setting-up-your-life-in-new-zealand-when-you-arrive-in-new-zealand
    checked: 2026-10-27
    verified: true
  - id: T06.why.ird-text
    text: "Inland Revenue says that if your new-arrival IRD number application is approved, you'll receive the number by text or email."
    source: ird-new-arrival
    checked: 2026-10-27
    verified: true
  - id: T06.why.emergency
    text: "Police say calls to 111 are free, and you can call 111 on a mobile phone even if it's out of credit."
    source: police-call-111
    checked: 2026-10-27
    verified: true
steps:
  - id: T06.steps.111
    text: "Learn the emergency number: when you call 111, Police say you'll be asked whether you need Police, Fire or Ambulance."
    source: police-new-arrivals-communicating
    checked: 2026-10-27
    verified: true
  - id: T06.steps.105
    text: "For police matters that aren't emergencies, Police say to use the 105 number."
    source: police-new-arrivals-communicating
    checked: 2026-10-27
    verified: true
  - id: T06.steps.txt-111
    text: "If you have difficulty hearing or talking on the phone: Police say you can register for an emergency TXT service."
    source: police-new-arrivals-communicating
    checked: 2026-10-27
    verified: true
  - id: T06.steps.keep-number
    text: "If you change provider later, you can keep your number. The Commerce Commission says number portability lets you switch providers and keep the same phone number."
    source: comcom-number-portability
    checked: 2026-10-27
    verified: true
documents: []
mistakes:
  - id: T06.mistakes.new-number
    text: "Trusting a message from a \"new number\" that claims to be a relative who lost their phone. Consumer Protection says to contact the relative on the number already stored in your phone."
    source: consumer-protection-scam-types
    checked: 2026-10-27
    verified: true
  - id: T06.mistakes.codes
    text: "Giving a one-time verification code to someone who contacts you out of the blue. Consumer Protection lists these codes among the things scammers ask for."
    source: consumer-protection-scam-types
    checked: 2026-10-27
    verified: true
watchOuts:
  - id: T06.watchOuts.7726
    text: "The Department of Internal Affairs says you can forward a spam or scam text free of charge to 7726 to report it."
    source: dia-txt-spam
    checked: 2026-10-27
    verified: true
  - id: T06.watchOuts.complaints
    text: "If you have a problem with your phone provider, govt.nz says to complain to the provider first, then to Telecommunications Dispute Resolution, which is free and independent."
    source: govt-utility-complaints
    checked: 2026-10-27
    verified: true
