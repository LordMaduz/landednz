id: T18
name: Building NZ Credit History
phase: 3
priority: 58
boosts: []
urgency: []
duration: Ongoing (low-effort passive process)
appliesTo:
  family:
    - SOLO
    - COUPLE_DUAL_WORK
    - COUPLE_CONSTRAINED
    - FAMILY_WITH_CHILDREN
dependsOn: []
retired: true
why:
  - id: T18.why.1
    text: Passive credit building starts immediately — ensure your phone, electricity, and internet are all in your name.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
steps:
  - id: T18.steps.1
    text: Electricity, internet, and phone accounts in your own name from the start of your tenancy will contribute to your credit file. Joint accounts are reported for both account holders.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.steps.2
    text: Never miss a payment. Set up automatic payments (direct debit) for rent, utilities, phone, and any credit facilities. A single missed payment can appear on your credit file and negatively affect your score for up to 5 years.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.steps.3
    text: Wait until you have 3–6 months of NZ salary deposits into your NZ bank account. Apply for an entry-level credit card from your bank first — they have your transaction history. Start with a low credit limit ($1,000–$2,000). Use the card for small regular purchases (groceries, petrol) and pay the balance in full each month.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.steps.4
    text: Each credit application creates a hard enquiry on your credit file. Multiple hard enquiries in a short period reduce your score. Apply for one product, wait 3–6 months, then consider the next.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.steps.5
    text: "All NZ consumers are entitled to one free credit report per year from each bureau. Check for errors, fraudulent accounts, or incorrect defaults. Access free reports at: - Centrix: centrix.co.nz - Equifax NZ: equifax.co.nz - illion: illion.co.nz"
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.steps.6
    text: Credit utilisation (balance ÷ credit limit) should ideally stay below 30%. If your card limit is $2,000, keep your monthly spend below $600 before repayment.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
documents: []
mistakes:
  - id: T18.mistakes.1
    text: Do not apply for a credit card in the first month — rejection due to insufficient NZ credit history creates a hard enquiry that harms your thin credit file. Wait 3–6 months.
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.mistakes.2
    text: "Failing to understand: Store credit (e.g. buy-now-pay-later services like Afterpay, Laybuy, Humm) appears on NZ credit files. Use sparingly and always repay on time."
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.mistakes.3
    text: "Failing to understand: If you receive pre-approved credit offers, read the terms carefully — some NZ financial products targeted at new migrants carry high interest rates (18–26% p.a. [Type C])."
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.mistakes.4
    text: 'Failing to understand: NZ "no credit history" is different from "bad credit" — be patient. Most lenders understand that new migrants have thin files and weigh income and employment stability accordingly after 6–12 months.'
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T18.mistakes.5
    text: "Failing to understand: Closing a credit account reduces your average account age — keep your first NZ credit card open even after upgrading to better products later."
    source: www-privacy-org-nz-privacy-act-2020-codes-of-practice-credit-reporting-privacy-code-2020
    checked: 2026-03-03
    verified: false
    numberType: C
