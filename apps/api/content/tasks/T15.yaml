id: T15
name: International Remittances Setup
phase: 3
priority: 75
boosts: []
urgency: []
duration: 1–2 hours (account setup and first transfer)
appliesTo:
  family:
    - SOLO
    - COUPLE_DUAL_WORK
    - COUPLE_CONSTRAINED
    - FAMILY_WITH_CHILDREN
dependsOn:
  - task: T07
    type: hard
retired: true
why:
  - id: T15.why.1
    text: Set up Wise within your first month — it takes 1–2 days to verify and is useful to have ready before you need it.
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
steps:
  - id: T15.steps.1
    text: "For most AEWV migrants remitting to India or Sri Lanka: Wise is the default recommendation for best exchange rate and transparency. Compare Wise vs Instarem at time of transfer for best rate."
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.steps.2
    text: "URL: https://wise.com Register with email. Complete identity verification: upload passport and NZ address proof (bank statement or utility bill). Verification typically takes 1–2 business days for NZ residents."
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.steps.3
    text: Link your NZ bank account (ANZ or other) to Wise. This is used to fund transfers.
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.steps.4
    text: "For India: recipient's full name (as per bank records), bank name, account number, IFSC code. For Sri Lanka: recipient's full name, bank name, account number, SWIFT code, branch address. Note: The recipient name in Wise must exactly match the name on the bank account. Mismatches cause transfer delays or returns."
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.steps.5
    text: Send NZD 50–100 on your first transfer to confirm the full process works end-to-end. Verify receipt at the other end, confirm exchange rate received, and note transfer time.
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.steps.6
    text: Wise allows scheduled regular transfers (e.g. monthly on a specific date). Useful if you have fixed monthly obligations (loan EMI, parental support).
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.steps.7
    text: Export transfer history from Wise/Instarem annually. Useful for tax documentation and for demonstrating source of funds to Indian/Sri Lankan banks if queried.
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
documents:
  - id: T15.documents.1
    text: passport
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.documents.2
    text: bank statement
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
mistakes:
  - id: T15.mistakes.1
    text: Do not use your NZ bank's international wire for regular remittances — the combined fee and exchange rate margin makes it 3–5x more expensive than Wise for the same transfer.
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.mistakes.2
    text: "Failing to understand: Recipient name on Wise must match exactly the account holder name at the destination bank. Use the full legal name as registered with the bank, not a shortened or nickname version."
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.mistakes.3
    text: "Failing to understand: Sri Lanka's foreign exchange situation has been volatile since 2022 — verify remittance processing is normal before large transfers. Central Bank of Sri Lanka guidance: cbsl.gov.lk."
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.mistakes.4
    text: 'Failing to understand: NZ banks may flag large or unusual outbound transfers and request documentation of source of funds. This is standard AML compliance — not an accusation. Have a brief explanation ready (e.g. "monthly family support," "home loan repayment").'
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
  - id: T15.mistakes.5
    text: "Failing to understand: If you are remitting to service an overseas mortgage or investment property, keep records as this may have NZ tax implications once your transitional resident exemption expires (4 years from NZ tax residency)."
    source: wise-com-nz
    checked: 2026-03-03
    verified: false
    numberType: C
