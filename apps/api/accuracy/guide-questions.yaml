# Settlement guide accuracy set (spec §9.3). Run: make guide-accuracy (see scripts/guide-accuracy.ts).
# Questions come from the content bundle's tasks; expect.sources are URL fragments of the official pages those tasks cite (any one counts).
# Categories: topic, task_screen, follow_up, out_of_scope, distress, live, uncovered.

- id: ird-number
  category: topic
  profile: &solo { visaType: AEWV, city: AUCKLAND, familySituation: SOLO, occupation: OTHER_PROFESSIONAL, arrivalDaysAgo: 5 }
  screen: { kind: home }
  question: How do I get an IRD number after I arrive?
  expect: { sources: [ird.govt.nz], decline: false, distress: false }

