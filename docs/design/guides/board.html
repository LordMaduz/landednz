<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public guides boards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens copied from apps/web globals.css roles: title 24/22, section 16/15, body 16/15, small 12; same at all widths except phone sizes */
:root{--fg:#0F2A3A;--muted:#4B6170;--link:#0A6463;--link-h:#074B4A;--border:#E3E8EA;--sunken:#F6F8F8;--focus:#0E7C7B}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF0;font-family:'Geist',system-ui,sans-serif;color:var(--fg)}
.board{padding:24px;display:flex;flex-direction:column;gap:32px;align-items:flex-start}
.board h2.label{font-size:14px;margin:0;font-weight:600}
.board p.note{margin:0;font-size:13px;color:var(--muted);max-width:900px}
.art{background:#fff;overflow:hidden;display:flex;flex-direction:column;border:1px solid #cdd7db}
.art.d{width:1440px;min-height:900px}.art.m{width:390px;min-height:844px}
.m{--title:24px;--sec:16px;--body:16px;--hh:56px}.d{--title:22px;--sec:15px;--body:15px;--hh:44px}
.art{font-size:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
.art h1,.art h2,.art p,.art ol,.art ul{margin:0}
.art a{color:var(--link);text-decoration:none}.art a:hover{color:var(--link-h);text-decoration:underline}
.art :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hdr{height:var(--hh);border-bottom:1px solid #F1F4F5;display:flex;align-items:center}
.wrap{width:100%;max-width:1168px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.m .wrap{padding:0 16px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--fg)!important}
.btn{white-space:nowrap;flex-shrink:0;font:inherit;font-weight:500;min-height:44px;padding:0 16px;border-radius:6px;display:inline-flex;align-items:center;border:1px solid transparent;background:var(--fg);color:#fff!important;text-decoration:none!important}
.btn.quiet{background:#fff;color:var(--fg)!important;border-color:#D5DFE2}
.ftr{margin-top:auto;border-top:1px solid #F1F4F5}
.ftr .wrap{min-height:48px;font-size:12px;color:var(--muted);gap:16px}
.ftr nav{display:flex;gap:24px}.m .ftr nav{gap:16px}.ftr nav a{color:var(--muted);min-height:44px;display:inline-flex;align-items:center;margin:-8px 0}
.m .ftr .long{display:none}.d .ftr .short{display:none}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-bottom:16px}.crumbs a{color:var(--muted)}
main{width:100%;padding:64px 24px 96px;display:flex;gap:64px}
.col{width:100%;max-width:680px;display:flex;flex-direction:column;gap:16px}
.a main{justify-content:center}
.b main{max-width:1168px;margin:0 auto}
.head{display:flex;flex-direction:column;gap:4px}
.title{font-size:var(--title);line-height:1.25;letter-spacing:-.015em;font-weight:600;text-wrap:balance}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.sec h2{font-size:var(--sec);line-height:1.35;font-weight:600;letter-spacing:-.005em}
.sec ul{padding-left:24px;display:flex;flex-direction:column;gap:8px}
.sec li{line-height:1.6}
.sec ol{padding-left:24px;display:flex;flex-direction:column;gap:8px}
.sec li::marker{color:var(--muted)}
.sec ol li::marker{font-weight:600;color:var(--fg)}
.grp{display:flex;flex-direction:column;gap:4px}.grp small{font-size:12px;color:var(--muted)}
.sec ul.srcs{list-style:none;padding:0;flex-direction:row;flex-wrap:wrap;gap:0 16px}.srcs li{min-height:24px;display:flex;align-items:center;font-size:var(--body)}
.strip{background:var(--sunken);border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.strip p{line-height:1.5}.m .strip{flex-direction:column;align-items:flex-start}
.cta{border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.m .cta{padding:16px}
.cta p.big{font-weight:600;font-size:var(--sec);line-height:1.35}
.rail{margin-left:auto;width:240px;flex-shrink:0;position:sticky;top:80px;align-self:flex-start;display:flex;flex-direction:column;gap:12px}
.rail p{font-size:12px;font-weight:600}.rail nav{display:flex;flex-direction:column;gap:8px}.rail a{font-size:12px;color:var(--muted)}.rail a:hover{color:var(--fg)}
.m .rail{display:none}
.row{display:flex;align-items:center;min-height:44px;color:var(--fg)!important;padding:8px 0;border-bottom:1px solid #F1F4F5}
.row:hover{text-decoration:underline}
.legs{display:flex;flex-direction:column;gap:32px}
.leg{display:flex;flex-direction:column;gap:4px}
.leg h2{font-size:var(--sec);font-weight:600;line-height:1.35;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:4px}
.leg h2 span{font-size:12px;font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<div class="board" id="board"></div>
<script>
const SRC=[["Tax code declaration (IR330)","Inland Revenue"],["Register for a myIR account","Inland Revenue"],["New arrival to New Zealand: IRD number application","Inland Revenue"],["Work or study in New Zealand","Inland Revenue"],["Using the right RWT tax rate","Inland Revenue"],["Find my IRD number","Inland Revenue"],["When you need an IRD number","Inland Revenue"],["I cannot get my IRD number online","Inland Revenue"],["Phone numbers","Inland Revenue"],["Living in New Zealand and not a new arrival: IRD number application","Inland Revenue"]];
const hdr=`<header class="hdr"><div class="wrap"><a class="brand" href="#">LandedNZ</a><a class="btn quiet" href="#">Sign in</a></div></header>`;
const ftr=`<footer class="ftr"><div class="wrap"><span><span class="long">General information, not legal or tax advice.</span><span class="short">Not legal or tax advice</span></span><nav aria-label="Legal"><a href="#">Guides</a><a href="#">About</a><a href="#">Privacy</a><a href="#">Terms</a></nav></div></footer>`;
const li=a=>a.map(t=>`<li>${t}</li>`).join("");
const sec=(id,h,body)=>`<section class="sec" id="${id}"><h2>${h}</h2>${body}</section>`;
function guide(variant){
  const parts=[
   ["why","Why it matters",`<ul>${li(["Without your IRD number and a tax code declaration, your employer deducts tax at 45% plus the earners' levy."])}</ul>`],
   ["steps","Steps",`<ol>${li(["Register for myIR, Inland Revenue's online service. You don't need an IRD number to register.","In myIR, apply as a new arrival. Inland Revenue checks your identity with Immigration New Zealand.","Apply by your visa's final arrival date, the date you must arrive in New Zealand by. After that date you apply as living in New Zealand instead.","If you hold a work or student visa: Inland Revenue's work and study page says new arrivals on these visas also need a New Zealand bank account or a customer due diligence form (IR997). Have one of them ready.","If your application is approved, your IRD number comes by text or email in 2 days.","Give your employer your IRD number with a completed tax code declaration (IR330).","Give your bank your IRD number too. Without it, tax on interest is deducted at 45%."])}</ol>`],
   ["documents","Documents you'll need",`<ul>${li(["Your passport details","Your Immigration New Zealand application number (not needed if you have an Australian passport)","If you hold a work or student visa: your most recent overseas tax number, if you have one"])}</ul>`],
   ["mistakes","Common mistakes",`<ul>${li(["Applying again when you've had an IRD number before. You keep the same number for life, so find your old one instead."])}</ul>`],
   ["watch","Watch out for",`<ul>${li(["Applying is free. Inland Revenue doesn't charge for an IRD number.","If the new-arrival application doesn't work, Inland Revenue explains the other ways to apply.","Inland Revenue's phone number for personal customers is 0800 227 774, or +64 4 832 5223 from overseas.","If you apply as living in New Zealand instead, you take your identity documents to an AA Driver Licensing Agent within 14 days of applying online."])}</ul>`],
   ["sources","Sources",Object.entries(SRC.reduce((g,s)=>((g[s[1]]??=[]).push(s[0]),g),{})).map(([ag,ls])=>`<div class="grp"><small>${ag}</small><ul class="srcs">${ls.map(t=>`<li><a href="#">${t}</a></li>`).join("")}</ul></div>`).join("")]
  ];
  const strip=`<aside class="strip" aria-label="Your plan"><p><strong>This is 1 of 27 things to sort out when you move.</strong> Get your plan in the right order.</p><a class="btn" href="#">Start free</a></aside>`;
  const cta=`<aside class="cta" aria-label="Your plan"><p class="big">This is 1 of 27 things to sort out when you move.</p><p class="muted">Some steps depend on your visa or family. Get your plan in the right order.</p><a class="btn" href="#">Start free</a></aside>`;
  const rail=`<aside class="rail" aria-label="On this page"><p>On this page</p><nav>${parts.map(p=>`<a href="#${p[0]}">${p[1]}</a>`).join("")}</nav></aside>`;
  return `${hdr}<main><div class="col"><div class="head"><nav class="crumbs" aria-label="Breadcrumb"><a href="#">Guides</a><span>/</span><span>Get your IRD number</span></nav><h1 class="title">Get your IRD number</h1><p class="muted">Last checked 25 Oct 2026</p></div>${parts.map(p=>sec(...p)+(p[0]==="steps"?strip:"")).join("")}${cta}</div>${variant==="b"?rail:""}</main>${ftr}`;
}
function index(){
  const L=[["Before you fly",["Choose where to live","Book temporary accommodation","Check whether you need a qualification assessment (IQA)","Prepare an NZ-style CV and start your job search","Check your public health eligibility and cover","Confirm your occupational registration before you start work","Gather and carry your key documents","Check what you can bring and how to ship it","If you're bringing a cat or dog","Complete your NZ Traveller Declaration"]],["Arrival",["Get an NZ SIM card","Open an NZ bank account","Get your IRD number","Read your visa conditions on Immigration NZ"]],["Week 1",["Give your employer a tax code (IR330)","Sign a rental and protect your bond","Enrol with a GP","Know your employment rights","Enrol your child in school"]],["Month 1",["Join KiwiSaver or review your fund","Convert your overseas driver licence","Find early childhood education and 20 Hours ECE","Enrol your child in Well Child, immunisations and free dental care","Find settlement support and English classes","Understand your NZ tax residency and foreign-income exemption"]],["Later",["Check Working for Families","Make a household emergency plan"]]];
  return `${hdr}<main style="justify-content:center"><div class="col"><div class="head"><h1 class="title">Guides</h1><p class="muted">Step-by-step help for 27 things to sort out when you move to New Zealand. Every step comes from an official site.</p></div><div class="legs">${L.map(l=>`<section class="leg"><h2>${l[0]}<span>${l[1].length} guides</span></h2>${l[1].map(t=>`<a class="row" href="#">${t}</a>`).join("")}</section>`).join("")}</div></div></main>${ftr}`;
}
const art=(cls,html)=>`<div class="art ${cls}">${html}</div>`;
document.getElementById("board").innerHTML=`
<h2 class="label">Guide page, variant A (recommended): reading column centred like About, Privacy and Terms</h2>
<p class="note">One column at max-w-legal (680). No rail: guides are 1–2 screens, the page is the same shape as the other public pages. Breadcrumb on top matches the BreadcrumbList. CTA ends the page, per G1.</p>
<div style="display:flex;gap:32px;align-items:flex-start">${art("d a",guide("a"))}${art("m a",guide("a"))}</div>
<h2 class="label">Guide page, variant B: column at the logo edge with a sticky "On this page" rail from 1100 px</h2>
<p class="note">Same as the signed-in legal layout. Helps on long guides (7+ steps and 6 sections); phones identical to A.</p>
${art("d b",guide("b"))}
<h2 class="label">/guides index: five legs, one link per guide (390 and 1440)</h2>
<p class="note">Leg names from legName(id, true). Rows are 44 px targets. Count line per leg replaces any badge. Footer gains a Guides link.</p>
<div style="display:flex;gap:32px;align-items:flex-start">${art("d a",index())}${art("m a",index())}</div>`;
</script>
</body>
</html>
